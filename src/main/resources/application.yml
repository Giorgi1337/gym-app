spring:
  application:
    name: gym-crm

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,flyway

  endpoint:
    health:
      show-details: always

  info:
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true

  tracing:
    sampling:
      probability: 1.0


  otlp:
    metrics:
      export:
        enabled: false

  health:
    defaults:
      enabled: false

  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      percentiles:
        http:
          server:
            request: 0.5,0.9,0.95,0.99

logging:
  level:
    root: INFO
    com.gym: INFO