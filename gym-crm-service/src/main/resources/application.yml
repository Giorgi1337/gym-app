spring:
  application:
    name: gym-crm-service

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,flyway

  endpoint:
    health:
      show-details: always

  info:
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true

  tracing:
    sampling:
      probability: 1.0


  otlp:
    metrics:
      export:
        enabled: false

  health:
    defaults:
      enabled: false

  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      percentiles:
        http:
          server:
            request: 0.5,0.9,0.95,0.99

logging:
  level:
    root: INFO
    com.gym: INFO

resilience4j:
  circuitbreaker:
    instances:
      trainerWorkload:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        ignore-exceptions:
          - feign.FeignException$FeignClientException
  retry:
    instances:
      trainerWorkload:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - feign.FeignException$FeignClientException
