services:
  postgres:
    image: postgres:18
    container_name: postgres-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgre/data

  activemq:
    image: apache/activemq-artemis:2.44.0
    container_name: gym-activemq
    environment:
      ARTEMIS_USER: ${ACTIVEMQ_USER}
      ARTEMIS_PASSWORD: ${ACTIVEMQ_PASSWORD}
    ports:
      - '61616:61616'
      - '8161:8161'

volumes:
  postgres_data: