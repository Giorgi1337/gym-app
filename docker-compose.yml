services:
  discovery:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    image: gym-discovery-service:local
    ports:
      - "8761:8761"
    networks:
      - gym-network

  postgres:
    image: postgres:18
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gym-network

  activemq:
    image: apache/activemq-artemis:2.44.0
    container_name: gym-activemq
    environment:
      ARTEMIS_USER: ${ACTIVEMQ_USER:-admin}
      ARTEMIS_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
    ports:
      - "61616:61616"
      - "8161:8161"
    networks:
      - gym-network

  mongodb:
    image: mongo:8.3.7
    container_name: gym-mongodb
    environment:
      MONGO_INITDB_DATABASE: trainer_workload
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gym-network

  main:
    build:
      context: .
      dockerfile: gym-crm-service/Dockerfile
    image: gym-main-service:local
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mydatabase}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-myuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_started
      discovery:
        condition: service_started
    networks:
      - gym-network

  report:
    build:
      context: .
      dockerfile: trainer-workload-service/Dockerfile
    image: gym-report-service:local
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      MONGODB_URI: mongodb://mongodb:27017/trainer_workload
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
      activemq:
        condition: service_started
      discovery:
        condition: service_started
    networks:
      - gym-network

volumes:
  postgres_data:
  mongodb_data:

networks:
  gym-network:
    name: gym-network
