services:
  postgres:
    image: postgres:18
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  activemq:
    image: apache/activemq-artemis:2.44.0
    container_name: gym-activemq
    environment:
      ARTEMIS_USER: ${ACTIVEMQ_USER:-admin}
      ARTEMIS_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
    ports:
      - "61616:61616"
      - "8161:8161"

  mongodb:
    image: mongo:8.3.7
    container_name: gym-mongodb
    environment:
      MONGO_INITDB_DATABASE: trainer_workload
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  postgres_data:
  mongodb_data:
